version: '3.9'

services:
  postgres-products:
    image: postgres:16-alpine
    container_name: minimarket-postgres-products
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: minimarket
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5433:5432"
    networks:
      - minimarket-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minimarket -d products_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:16-alpine
    container_name: minimarket-postgres-inventory
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: minimarket
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5434:5432"
    networks:
      - minimarket-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minimarket -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-service:
    build: ./product-service
    container_name: minimarket-product-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-products:5432/products_db
      SPRING_DATASOURCE_USERNAME: minimarket
      SPRING_DATASOURCE_PASSWORD: secretpassword
    depends_on:
      postgres-products:
        condition: service_healthy
    networks:
      - minimarket-net

  inventory-service:
    build: ./inventory-service
    container_name: minimarket-inventory-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: minimarket
      SPRING_DATASOURCE_PASSWORD: secretpassword
      PRODUCT_SERVICE_URL: http://product-service:8081
    depends_on:
      postgres-inventory:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - minimarket-net

networks:
  minimarket-net:
    driver: bridge
